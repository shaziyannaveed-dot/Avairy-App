<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Aviary Journal — Breeding Setup Records</title>
<meta name="theme-color" content="#16231C" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23D4A24C%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22>🪶</text></svg>" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(242,239,230,0.2); border-radius: 3px; }
  select, input, textarea, button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------------- THEME ---------------- */
const T = {
  bg: "#16231C", surface: "#1F2F26", surfaceAlt: "#25362B", surfaceRaised: "#2B3F32",
  accent: "#D4A24C", accentSoft: "#E8C98A", text: "#F2EFE6", textMuted: "#9BAE9E",
  danger: "#C1584B", success: "#7FA66B", border: "rgba(242,239,230,0.10)", borderStrong: "rgba(242,239,230,0.18)",
};
const CATS = ["Feeding", "Safai (Cleaning)", "Sehat Check (Health)", "Nest Check", "Doosra (Other)"];
const CAT_COLOR = { "Feeding": T.accent, "Safai (Cleaning)": "#7C9C86", "Sehat Check (Health)": T.danger, "Nest Check": "#8FA8C2", "Doosra (Other)": T.textMuted };
const DAYS = [{key:1,short:"Pir"},{key:2,short:"Mangl"},{key:3,short:"Budh"},{key:4,short:"Jum'a"},{key:5,short:"Juma"},{key:6,short:"Hafta"},{key:0,short:"Itwar"}];
const STATUS_OPTS = ["Active", "Aaram (Resting)", "Incubating"];
const STATUS_COLOR = { "Active": T.success, "Aaram (Resting)": T.textMuted, "Incubating": T.accent };
const EGG_STATUS = ["Incubating", "Hatched", "Fail Hui"];

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => !iso ? "—" : new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const monthKey = (iso) => iso.slice(0,7);
const monthLabel = (mk) => { const [y,m]=mk.split("-"); return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-GB",{month:"short",year:"2-digit"}); };

/* ---------------- Storage (localStorage) ---------------- */
const STORE_KEY = "aviary-journal-data-v1";
function loadData() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}
function saveData(d) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); return true; }
  catch(e) { return false; }
}

/* ---------------- Icons (inline SVG, lucide-style) ---------------- */
const Icon = ({ path, size=16, color="currentColor", strokeWidth=2, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const IDashboard = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></Icon>;
const IUsers = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
const ICalendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></Icon>;
const IEgg = (p) => <Icon {...p}><path d="M12 22c6 0 8-4.5 8-9 0-6-4-11-8-11S4 7 4 13c0 4.5 2 9 8 9Z"/></Icon>;
const IHistory = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></Icon>;
const IPlus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
const ITrash = (p) => <Icon {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></Icon>;
const IPencil = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;
const IX = (p) => <Icon {...p}><path d="M18 6 6 18M6 6l12 12"/></Icon>;
const ICheck = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
const IFeather = (p) => <Icon {...p}><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8 2 22M17.5 15H9"/></Icon>;
const IAlert = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></Icon>;

/* ---------------- Primitives ---------------- */
function Card({ children, style, ...rest }) {
  return <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, ...style }} {...rest}>{children}</div>;
}
function Btn({ children, onClick, variant="primary", style, disabled }) {
  const base = { display:"inline-flex", alignItems:"center", gap:6, padding:"9px 16px", borderRadius:10, fontSize:13.5, fontWeight:600, cursor: disabled?"not-allowed":"pointer", border:"1px solid transparent", opacity: disabled?0.5:1 };
  const variants = { primary:{background:T.accent,color:"#20200f"}, ghost:{background:"transparent",color:T.text,border:`1px solid ${T.borderStrong}`}, danger:{background:"transparent",color:T.danger,border:`1px solid ${T.danger}55`} };
  return <button disabled={disabled} onClick={onClick} style={{...base,...variants[variant],...style}}>{children}</button>;
}
function Field({ label, children }) {
  return <label style={{ display:"flex", flexDirection:"column", gap:5, fontSize:12.5, color:T.textMuted }}>{label}{children}</label>;
}
const inputStyle = { background:T.surfaceAlt, border:`1px solid ${T.borderStrong}`, borderRadius:8, padding:"8px 10px", color:T.text, fontSize:13.5, outline:"none", width:"100%" };
function Modal({ title, onClose, children, wide }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(10,15,11,0.6)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:50, padding:16 }} onClick={onClose}>
      <div style={{ background:T.surface, border:`1px solid ${T.borderStrong}`, borderRadius:16, padding:22, width:"100%", maxWidth: wide?560:420, maxHeight:"88vh", overflowY:"auto" }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <h3 style={{ fontFamily:"Fraunces, serif", fontSize:19, margin:0, fontWeight:600, color:T.text }}>{title}</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", color:T.textMuted, cursor:"pointer" }}><IX size={18}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Empty({ icon:Ic, text }) {
  return <div style={{ textAlign:"center", padding:"36px 16px", color:T.textMuted }}><Ic size={26} style={{marginBottom:8,opacity:0.6}}/><div style={{fontSize:13.5}}>{text}</div></div>;
}
function IncubationRing({ layDate, expectedHatchDate, status, size=54 }) {
  const total = Math.max(1, daysBetween(layDate, expectedHatchDate || layDate));
  const elapsed = Math.min(total, Math.max(0, daysBetween(layDate, todayISO())));
  const pct = elapsed/total;
  const r = (size-8)/2, c = 2*Math.PI*r;
  const color = status==="Hatched"?T.success:status==="Fail Hui"?T.danger:T.accent;
  return (
    <div style={{ position:"relative", width:size, height:size, flexShrink:0 }}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} stroke={T.borderStrong} strokeWidth="4" fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth="4" fill="none" strokeDasharray={c} strokeDashoffset={c*(1-pct)} strokeLinecap="round"/>
      </svg>
      <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}><IEgg size={size*0.36} color={color}/></div>
    </div>
  );
}
/* Simple custom bar chart */
function SimpleBarChart({ data, keys, colors, height=200 }) {
  const max = Math.max(1, ...data.flatMap(d => keys.map(k => d[k]||0)));
  const w = 100/data.length;
  return (
    <div style={{ display:"flex", alignItems:"flex-end", height, gap:4, borderBottom:`1px solid ${T.border}`, paddingBottom:4 }}>
      {data.map((d,i) => (
        <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
          <div style={{ display:"flex", alignItems:"flex-end", gap:2, height:height-24, width:"100%", justifyContent:"center" }}>
            {keys.map((k,ki) => (
              <div key={k} title={`${k}: ${d[k]||0}`} style={{ width:10, height:`${((d[k]||0)/max)*100}%`, background:colors[ki], borderRadius:"3px 3px 0 0", minHeight: d[k]?2:0 }}/>
            ))}
          </div>
          <div style={{ fontSize:10, color:T.textMuted }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}
/* Simple donut chart */
function SimpleDonut({ data, size=180 }) {
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let acc = 0;
  const r = size/2 - 14, c = 2*Math.PI*r;
  return (
    <div style={{ display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        {data.map((d,i) => {
          const frac = d.value/total;
          const dash = `${frac*c} ${c-frac*c}`;
          const offset = -acc*c;
          acc += frac;
          return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth="16" strokeDasharray={dash} strokeDashoffset={offset}/>;
        })}
      </svg>
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {data.map((d,i) => (
          <div key={i} style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:T.textMuted }}>
            <span style={{ width:9, height:9, borderRadius:2, background:d.color }}/> {d.name}: {d.value}
          </div>
        ))}
      </div>
    </div>
  );
}
function StatCard({ label, value, sub }) {
  return <Card style={{ padding:"14px 16px" }}>
    <div style={{ fontSize:11.5, color:T.textMuted, marginBottom:6 }}>{label}</div>
    <div style={{ fontFamily:"Fraunces, serif", fontSize:26, fontWeight:700, color:T.accentSoft, lineHeight:1 }}>{value}</div>
    <div style={{ fontSize:11, color:T.textMuted, marginTop:4 }}>{sub}</div>
  </Card>;
}
function SectionTitle({ children }) {
  return <div style={{ fontFamily:"Fraunces, serif", fontSize:15.5, fontWeight:600, marginBottom:12, color:T.text }}>{children}</div>;
}

/* ================= MAIN APP ================= */
function App() {
  const [tab, setTab] = useState("dashboard");
  const [pairs, setPairs] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [eggs, setEggs] = useState([]);
  const [history, setHistory] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    const d = loadData();
    if (d) { setPairs(d.pairs||[]); setTasks(d.tasks||[]); setEggs(d.eggs||[]); setHistory(d.history||[]); }
    setLoaded(true);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const ok = saveData({ pairs, tasks, eggs, history });
    setErr(ok ? "" : "Data save nahi ho saka.");
  }, [pairs, tasks, eggs, history, loaded]);

  const logHistory = useCallback((type, message) => {
    setHistory(h => [{ id:uid(), date:new Date().toISOString(), type, message }, ...h].slice(0,300));
  }, []);

  const tabs = [
    { key:"dashboard", label:"Dashboard", icon:IDashboard },
    { key:"pairs", label:"Pairs", icon:IUsers },
    { key:"weekly", label:"Weekly Plan", icon:ICalendar },
    { key:"eggs", label:"Eggs & Hatching", icon:IEgg },
    { key:"history", label:"History", icon:IHistory },
  ];

  if (!loaded) return <div style={{ minHeight:"100vh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", color:T.textMuted, fontFamily:"Inter, sans-serif" }}>Load ho raha hai…</div>;

  return (
    <div style={{ minHeight:"100vh", background:T.bg, fontFamily:"Inter, sans-serif", color:T.text }}>
      <div style={{ borderBottom:`1px solid ${T.border}`, padding:"18px 20px", display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ width:36, height:36, borderRadius:10, background:T.accent, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><IFeather size={19} color="#20200f"/></div>
        <div>
          <div style={{ fontFamily:"Fraunces, serif", fontSize:20, fontWeight:700, lineHeight:1.1 }}>Aviary Journal</div>
          <div style={{ fontSize:11.5, color:T.textMuted }}>Breeding setup ka weekly plan aur record</div>
        </div>
      </div>
      {err && <div style={{ background:`${T.danger}22`, color:T.danger, padding:"8px 20px", fontSize:12.5, display:"flex", alignItems:"center", gap:6 }}><IAlert size={14}/> {err}</div>}
      <div style={{ display:"flex", gap:4, padding:"12px 16px 0", overflowX:"auto", borderBottom:`1px solid ${T.border}` }}>
        {tabs.map(t => {
          const Ic = t.icon, active = tab===t.key;
          return <button key={t.key} onClick={()=>setTab(t.key)} style={{ display:"flex", alignItems:"center", gap:6, padding:"9px 14px", background:"none", border:"none", cursor:"pointer", whiteSpace:"nowrap", color: active?T.accent:T.textMuted, fontSize:13.5, fontWeight:600, borderBottom: active?`2px solid ${T.accent}`:"2px solid transparent" }}><Ic size={15}/> {t.label}</button>;
        })}
      </div>
      <div style={{ padding:18, maxWidth:980, margin:"0 auto" }}>
        {tab==="dashboard" && <Dashboard pairs={pairs} tasks={tasks} eggs={eggs} history={history}/>}
        {tab==="pairs" && <PairsTab pairs={pairs} setPairs={setPairs} logHistory={logHistory} eggs={eggs}/>}
        {tab==="weekly" && <WeeklyTab tasks={tasks} setTasks={setTasks} pairs={pairs} logHistory={logHistory}/>}
        {tab==="eggs" && <EggsTab eggs={eggs} setEggs={setEggs} pairs={pairs} logHistory={logHistory}/>}
        {tab==="history" && <HistoryTab history={history} setHistory={setHistory}/>}
      </div>
    </div>
  );
}

function Dashboard({ pairs, tasks, eggs, history }) {
  const activePairs = pairs.filter(p=>p.status!=="Aaram (Resting)").length;
  const incubating = eggs.filter(e=>e.status==="Incubating").length;
  const totalEggs = eggs.reduce((s,e)=>s+Number(e.eggCount||0),0);
  const totalHatched = eggs.reduce((s,e)=>s+Number(e.hatchedCount||0),0);
  const hatchRate = totalEggs ? Math.round((totalHatched/totalEggs)*100) : 0;
  const todayDow = new Date().getDay(), todayISOstr = todayISO();
  const todaysTasks = tasks.filter(t=>t.daysOfWeek.includes(todayDow));
  const doneToday = todaysTasks.filter(t=>t.completions && t.completions[todayISOstr]).length;
  const statusData = STATUS_OPTS.map(s=>({name:s,value:pairs.filter(p=>p.status===s).length,color:STATUS_COLOR[s]})).filter(d=>d.value>0);
  const monthMap = {};
  eggs.forEach(e => { const mk=monthKey(e.layDate); if(!monthMap[mk]) monthMap[mk]={month:mk,laid:0,hatched:0}; monthMap[mk].laid+=Number(e.eggCount||0); monthMap[mk].hatched+=Number(e.hatchedCount||0); });
  const monthData = Object.values(monthMap).sort((a,b)=>a.month.localeCompare(b.month)).slice(-6).map(d=>({...d,label:monthLabel(d.month)}));
  const upcomingIncubations = eggs.filter(e=>e.status==="Incubating").sort((a,b)=>a.expectedHatchDate.localeCompare(b.expectedHatchDate)).slice(0,4);

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:12 }}>
        <StatCard label="Active Pairs" value={activePairs} sub={`${pairs.length} total`}/>
        <StatCard label="Incubating" value={incubating} sub="eggs abhi"/>
        <StatCard label="Hatch Rate" value={`${hatchRate}%`} sub={`${totalHatched}/${totalEggs} anday`}/>
        <StatCard label="Aaj Ke Tasks" value={`${doneToday}/${todaysTasks.length}`} sub="mukammal"/>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:12 }}>
        <Card style={{ padding:16 }}>
          <SectionTitle>Anday: Laid vs Hatched (aakhri 6 maheenay)</SectionTitle>
          {monthData.length ? <SimpleBarChart data={monthData} keys={["laid","hatched"]} colors={[T.accent,T.success]}/> : <Empty icon={IEgg} text="Abhi tak koi egg record nahi."/>}
        </Card>
        <Card style={{ padding:16 }}>
          <SectionTitle>Pairs ki Status</SectionTitle>
          {statusData.length ? <SimpleDonut data={statusData}/> : <Empty icon={IUsers} text="Pehle Pairs tab se pair add karein."/>}
        </Card>
      </div>
      <Card style={{ padding:16 }}>
        <SectionTitle>Incubation Progress</SectionTitle>
        {upcomingIncubations.length ? (
          <div style={{ display:"flex", flexWrap:"wrap", gap:18 }}>
            {upcomingIncubations.map(e => {
              const daysLeft = daysBetween(todayISO(), e.expectedHatchDate);
              return <div key={e.id} style={{ display:"flex", alignItems:"center", gap:10 }}>
                <IncubationRing layDate={e.layDate} expectedHatchDate={e.expectedHatchDate} status={e.status}/>
                <div>
                  <div style={{ fontSize:13, fontWeight:600 }}>{pairs.find(p=>p.id===e.pairId)?.tag||"—"}</div>
                  <div style={{ fontSize:11.5, color:T.textMuted, fontFamily:"IBM Plex Mono, monospace" }}>{daysLeft>0?`${daysLeft} din baaqi`:"hatch due"}</div>
                </div>
              </div>;
            })}
          </div>
        ) : <Empty icon={IEgg} text="Koi eggs abhi incubation mein nahi hain."/>}
      </Card>
      <Card style={{ padding:16 }}>
        <SectionTitle>Haal ki Activity</SectionTitle>
        {history.length ? (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {history.slice(0,6).map(h => (
              <div key={h.id} style={{ display:"flex", justifyContent:"space-between", fontSize:12.5 }}>
                <span>{h.message}</span>
                <span style={{ color:T.textMuted, fontFamily:"IBM Plex Mono, monospace", fontSize:11 }}>{new Date(h.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</span>
              </div>
            ))}
          </div>
        ) : <Empty icon={IHistory} text="Abhi tak koi activity record nahi hui."/>}
      </Card>
    </div>
  );
}

function PairsTab({ pairs, setPairs, logHistory, eggs }) {
  const [modal, setModal] = useState(null);
  const emptyForm = { tag:"", species:"", male:"", female:"", cage:"", pairedDate:todayISO(), status:"Active", notes:"" };
  const [form, setForm] = useState(emptyForm);
  const openAdd = () => { setForm(emptyForm); setModal({mode:"add"}); };
  const openEdit = (p) => { setForm(p); setModal({mode:"edit", id:p.id}); };
  const save = () => {
    if (!form.tag.trim()) return;
    if (modal.mode==="add") { setPairs(ps=>[{...form,id:uid()},...ps]); logHistory("pair", `Naya pair banaya gaya: ${form.tag}`); }
    else { setPairs(ps=>ps.map(p=>p.id===modal.id?{...form,id:modal.id}:p)); logHistory("pair", `Pair update hua: ${form.tag}`); }
    setModal(null);
  };
  const remove = (p) => { setPairs(ps=>ps.filter(x=>x.id!==p.id)); logHistory("pair", `Pair delete kiya gaya: ${p.tag}`); };
  const eggCountFor = (pairId) => eggs.filter(e=>e.pairId===pairId).length;

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <SectionTitle>Breeding Pairs ({pairs.length})</SectionTitle>
        <Btn onClick={openAdd}><IPlus size={15}/> Naya Pair</Btn>
      </div>
      {pairs.length===0 ? <Card style={{padding:8}}><Empty icon={IUsers} text="Abhi koi pair add nahi kiya."/></Card> : (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:12 }}>
          {pairs.map(p => (
            <Card key={p.id} style={{ padding:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                <div>
                  <div style={{ fontFamily:"Fraunces, serif", fontSize:16, fontWeight:600 }}>{p.tag}</div>
                  <div style={{ fontSize:12, color:T.textMuted }}>{p.species||"Species —"}</div>
                </div>
                <span style={{ fontSize:10.5, padding:"3px 8px", borderRadius:20, fontWeight:600, color:STATUS_COLOR[p.status], background:`${STATUS_COLOR[p.status]}22` }}>{p.status}</span>
              </div>
              <div style={{ fontSize:12, color:T.textMuted, marginTop:10, lineHeight:1.7 }}>
                <div>Nar (♂): {p.male||"—"} · Mada (♀): {p.female||"—"}</div>
                <div>Cage: {p.cage||"—"} · Paired: {fmtDate(p.pairedDate)}</div>
                <div>Egg records: {eggCountFor(p.id)}</div>
              </div>
              {p.notes && <div style={{ fontSize:12, marginTop:8, fontStyle:"italic" }}>"{p.notes}"</div>}
              <div style={{ display:"flex", gap:8, marginTop:12 }}>
                <Btn variant="ghost" onClick={()=>openEdit(p)} style={{padding:"6px 10px"}}><IPencil size={13}/> Edit</Btn>
                <Btn variant="danger" onClick={()=>remove(p)} style={{padding:"6px 10px"}}><ITrash size={13}/> Delete</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}
      {modal && (
        <Modal title={modal.mode==="add"?"Naya Pair":"Pair Edit Karein"} onClose={()=>setModal(null)}>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            <Field label="Pair Tag / Naam *"><input style={inputStyle} value={form.tag} onChange={e=>setForm({...form,tag:e.target.value})} placeholder="e.g. Pair A1"/></Field>
            <Field label="Species"><input style={inputStyle} value={form.species} onChange={e=>setForm({...form,species:e.target.value})} placeholder="e.g. Budgerigar"/></Field>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <Field label="Nar (Male)"><input style={inputStyle} value={form.male} onChange={e=>setForm({...form,male:e.target.value})}/></Field>
              <Field label="Mada (Female)"><input style={inputStyle} value={form.female} onChange={e=>setForm({...form,female:e.target.value})}/></Field>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <Field label="Cage No."><input style={inputStyle} value={form.cage} onChange={e=>setForm({...form,cage:e.target.value})}/></Field>
              <Field label="Paired Date"><input type="date" style={inputStyle} value={form.pairedDate} onChange={e=>setForm({...form,pairedDate:e.target.value})}/></Field>
            </div>
            <Field label="Status"><select style={inputStyle} value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>{STATUS_OPTS.map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
            <Field label="Notes"><textarea style={{...inputStyle,minHeight:60,resize:"vertical"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
            <div style={{ display:"flex", justifyContent:"flex-end", gap:8, marginTop:6 }}>
              <Btn variant="ghost" onClick={()=>setModal(null)}>Cancel</Btn>
              <Btn onClick={save}><ICheck size={15}/> Save</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function WeeklyTab({ tasks, setTasks, pairs, logHistory }) {
  const [modal, setModal] = useState(false);
  const emptyForm = { title:"", category:CATS[0], daysOfWeek:[], pairId:"", notes:"" };
  const [form, setForm] = useState(emptyForm);
  const todayDow = new Date().getDay();
  const toggleDay = (d) => setForm(f => ({...f, daysOfWeek: f.daysOfWeek.includes(d) ? f.daysOfWeek.filter(x=>x!==d) : [...f.daysOfWeek,d]}));
  const save = () => {
    if (!form.title.trim() || form.daysOfWeek.length===0) return;
    setTasks(ts=>[{...form,id:uid(),completions:{}},...ts]); logHistory("task", `Naya weekly task banaya: ${form.title}`);
    setForm(emptyForm); setModal(false);
  };
  const toggleComplete = (task, dateISO) => {
    setTasks(ts => ts.map(t => { if(t.id!==task.id) return t; const completions={...t.completions}; if(completions[dateISO]) delete completions[dateISO]; else completions[dateISO]=true; return {...t,completions}; }));
    if (!task.completions?.[dateISO]) logHistory("task", `Task mukammal: ${task.title} (${fmtDate(dateISO)})`);
  };
  const removeTask = (t) => { setTasks(ts=>ts.filter(x=>x.id!==t.id)); logHistory("task", `Task delete kiya gaya: ${t.title}`); };
  const weekDates = useMemo(() => {
    const now = new Date(), dow = now.getDay(), map = {};
    DAYS.forEach(d => { const diff=d.key-dow; const dt=new Date(now); dt.setDate(now.getDate()+diff); map[d.key]=dt.toISOString().slice(0,10); });
    return map;
  }, []);
  const weekCompletionRate = (task) => {
    const applicable = task.daysOfWeek.length; if (!applicable) return 0;
    const done = task.daysOfWeek.filter(d => task.completions?.[weekDates[d]]).length;
    return Math.round((done/applicable)*100);
  };
  const thStyle = { textAlign:"left", padding:"10px 12px", fontSize:11, color:T.textMuted, fontWeight:600, textTransform:"uppercase", letterSpacing:0.4 };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <SectionTitle>Weekly Care Plan ({tasks.length} tasks)</SectionTitle>
        <Btn onClick={()=>setModal(true)}><IPlus size={15}/> Naya Task</Btn>
      </div>
      {tasks.length===0 ? <Card style={{padding:8}}><Empty icon={ICalendar} text="Abhi koi weekly task nahi hai."/></Card> : (
        <Card style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", minWidth:640 }}>
            <thead><tr><th style={thStyle}>Task</th>{DAYS.map(d=><th key={d.key} style={{...thStyle,textAlign:"center",color:d.key===todayDow?T.accent:T.textMuted}}>{d.short}</th>)}<th style={thStyle}></th></tr></thead>
            <tbody>
              {tasks.map(t => (
                <tr key={t.id} style={{ borderTop:`1px solid ${T.border}` }}>
                  <td style={{ padding:"10px 12px" }}>
                    <div style={{ fontSize:13, fontWeight:600 }}>{t.title}</div>
                    <div style={{ fontSize:11, color:CAT_COLOR[t.category], marginTop:2 }}>{t.category}</div>
                    {t.pairId && <div style={{ fontSize:10.5, color:T.textMuted }}>{pairs.find(p=>p.id===t.pairId)?.tag||""}</div>}
                  </td>
                  {DAYS.map(d => {
                    const applicable = t.daysOfWeek.includes(d.key), dateISO=weekDates[d.key], done = applicable && t.completions?.[dateISO];
                    return <td key={d.key} style={{ textAlign:"center", padding:"10px 4px" }}>
                      {applicable ? <button onClick={()=>toggleComplete(t,dateISO)} style={{ width:26, height:26, borderRadius:8, border:`1px solid ${done?T.success:T.borderStrong}`, background: done?T.success:"transparent", color: done?"#0d160f":T.textMuted, cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center" }}>{done && <ICheck size={14}/>}</button> : <span style={{color:T.border}}>·</span>}
                    </td>;
                  })}
                  <td style={{ padding:"10px 8px", textAlign:"right" }}>
                    <div style={{ fontSize:10.5, color:T.textMuted, marginBottom:4, fontFamily:"IBM Plex Mono, monospace" }}>{weekCompletionRate(t)}%</div>
                    <button onClick={()=>removeTask(t)} style={{ background:"none", border:"none", color:T.danger, cursor:"pointer" }}><ITrash size={13}/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
      {modal && (
        <Modal title="Naya Weekly Task" onClose={()=>setModal(false)}>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            <Field label="Task ka Naam *"><input style={inputStyle} value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Seed & water change"/></Field>
            <Field label="Category"><select style={inputStyle} value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
            <Field label="Pair (optional)"><select style={inputStyle} value={form.pairId} onChange={e=>setForm({...form,pairId:e.target.value})}><option value="">Sab pairs ke liye</option>{pairs.map(p=><option key={p.id} value={p.id}>{p.tag}</option>)}</select></Field>
            <Field label="Kis din repeat ho? *">
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {DAYS.map(d => <button key={d.key} onClick={()=>toggleDay(d.key)} type="button" style={{ padding:"6px 10px", borderRadius:8, fontSize:12, border:`1px solid ${form.daysOfWeek.includes(d.key)?T.accent:T.borderStrong}`, background: form.daysOfWeek.includes(d.key)?`${T.accent}22`:"transparent", color: form.daysOfWeek.includes(d.key)?T.accentSoft:T.textMuted, cursor:"pointer" }}>{d.short}</button>)}
              </div>
            </Field>
            <Field label="Notes"><textarea style={{...inputStyle,minHeight:50,resize:"vertical"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
            <div style={{ display:"flex", justifyContent:"flex-end", gap:8, marginTop:6 }}>
              <Btn variant="ghost" onClick={()=>setModal(false)}>Cancel</Btn>
              <Btn onClick={save}><ICheck size={15}/> Save</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function EggsTab({ eggs, setEggs, pairs, logHistory }) {
  const [modal, setModal] = useState(null);
  const emptyForm = { pairId: pairs[0]?.id||"", layDate:todayISO(), eggCount:1, expectedHatchDate:"", actualHatchDate:"", hatchedCount:0, status:"Incubating", notes:"" };
  const [form, setForm] = useState(emptyForm);
  const openAdd = () => { setForm({...emptyForm, pairId: pairs[0]?.id||""}); setModal({mode:"add"}); };
  const openEdit = (e) => { setForm(e); setModal({mode:"edit", id:e.id}); };
  const save = () => {
    if (!form.pairId || !form.layDate) return;
    if (modal.mode==="add") { setEggs(es=>[{...form,id:uid()},...es]); logHistory("egg", `Naya egg record: ${pairs.find(p=>p.id===form.pairId)?.tag} — ${form.eggCount} anday`); }
    else { setEggs(es=>es.map(e=>e.id===modal.id?{...form,id:modal.id}:e)); logHistory("egg", `Egg record update hua: ${pairs.find(p=>p.id===form.pairId)?.tag}`); }
    setModal(null);
  };
  const remove = (e) => { setEggs(es=>es.filter(x=>x.id!==e.id)); logHistory("egg", `Egg record delete kiya gaya`); };
  const sorted = [...eggs].sort((a,b)=>b.layDate.localeCompare(a.layDate));

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <SectionTitle>Eggs & Hatching Records ({eggs.length})</SectionTitle>
        <Btn onClick={openAdd} disabled={pairs.length===0}><IPlus size={15}/> Naya Record</Btn>
      </div>
      {pairs.length===0 && <div style={{ fontSize:12.5, color:T.textMuted, marginBottom:10 }}>Pehle "Pairs" tab se kam az kam ek pair add karein.</div>}
      {sorted.length===0 ? <Card style={{padding:8}}><Empty icon={IEgg} text="Abhi koi egg record nahi hai."/></Card> : (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {sorted.map(e => (
            <Card key={e.id} style={{ padding:14, display:"flex", alignItems:"center", gap:14 }}>
              <IncubationRing layDate={e.layDate} expectedHatchDate={e.expectedHatchDate||e.layDate} status={e.status}/>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div style={{ fontFamily:"Fraunces, serif", fontSize:15, fontWeight:600 }}>{pairs.find(p=>p.id===e.pairId)?.tag||"—"}</div>
                  <span style={{ fontSize:10.5, padding:"3px 8px", borderRadius:20, fontWeight:600, color: e.status==="Hatched"?T.success:e.status==="Fail Hui"?T.danger:T.accent, background:`${e.status==="Hatched"?T.success:e.status==="Fail Hui"?T.danger:T.accent}22` }}>{e.status}</span>
                </div>
                <div style={{ fontSize:12, color:T.textMuted, marginTop:4 }}>
                  Laid: {fmtDate(e.layDate)} · Anday: {e.eggCount} · Expected hatch: {fmtDate(e.expectedHatchDate)}
                  {e.status!=="Incubating" && <> · Hatched: {e.hatchedCount}/{e.eggCount}</>}
                </div>
                {e.notes && <div style={{ fontSize:12, marginTop:4, fontStyle:"italic" }}>"{e.notes}"</div>}
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                <Btn variant="ghost" onClick={()=>openEdit(e)} style={{padding:"6px 10px"}}><IPencil size={13}/></Btn>
                <Btn variant="danger" onClick={()=>remove(e)} style={{padding:"6px 10px"}}><ITrash size={13}/></Btn>
              </div>
            </Card>
          ))}
        </div>
      )}
      {modal && (
        <Modal title={modal.mode==="add"?"Naya Egg Record":"Record Edit Karein"} onClose={()=>setModal(null)} wide>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            <Field label="Pair *"><select style={inputStyle} value={form.pairId} onChange={e=>setForm({...form,pairId:e.target.value})}>{pairs.map(p=><option key={p.id} value={p.id}>{p.tag}</option>)}</select></Field>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <Field label="Lay Date *"><input type="date" style={inputStyle} value={form.layDate} onChange={e=>setForm({...form,layDate:e.target.value})}/></Field>
              <Field label="Anday ki tadaad"><input type="number" min="0" style={inputStyle} value={form.eggCount} onChange={e=>setForm({...form,eggCount:e.target.value})}/></Field>
            </div>
            <Field label="Expected Hatch Date"><input type="date" style={inputStyle} value={form.expectedHatchDate} onChange={e=>setForm({...form,expectedHatchDate:e.target.value})}/></Field>
            <Field label="Status"><select style={inputStyle} value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>{EGG_STATUS.map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
            {form.status!=="Incubating" && (
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <Field label="Actual Hatch Date"><input type="date" style={inputStyle} value={form.actualHatchDate} onChange={e=>setForm({...form,actualHatchDate:e.target.value})}/></Field>
                <Field label="Hatched Count"><input type="number" min="0" style={inputStyle} value={form.hatchedCount} onChange={e=>setForm({...form,hatchedCount:e.target.value})}/></Field>
              </div>
            )}
            <Field label="Notes"><textarea style={{...inputStyle,minHeight:50,resize:"vertical"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
            <div style={{ display:"flex", justifyContent:"flex-end", gap:8, marginTop:6 }}>
              <Btn variant="ghost" onClick={()=>setModal(null)}>Cancel</Btn>
              <Btn onClick={save}><ICheck size={15}/> Save</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function HistoryTab({ history, setHistory }) {
  const [note, setNote] = useState("");
  const add = () => { if(!note.trim()) return; setHistory(h=>[{id:uid(),date:new Date().toISOString(),type:"note",message:note.trim()},...h]); setNote(""); };
  const remove = (id) => setHistory(h=>h.filter(x=>x.id!==id));
  return (
    <div>
      <SectionTitle>History & Notes</SectionTitle>
      <Card style={{ padding:14, marginBottom:14, display:"flex", gap:8 }}>
        <input style={{...inputStyle,flex:1}} placeholder="Manual note likhein…" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
        <Btn onClick={add}><IPlus size={15}/> Add</Btn>
      </Card>
      {history.length===0 ? <Card style={{padding:8}}><Empty icon={IHistory} text="Abhi tak koi history entry nahi hai."/></Card> : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {history.map(h => (
            <Card key={h.id} style={{ padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ width:6, height:6, borderRadius:"50%", background: h.type==="pair"?"#8FA8C2":h.type==="egg"?T.accent:h.type==="task"?T.success:T.textMuted }}/>
                <span style={{ fontSize:13 }}>{h.message}</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:11, color:T.textMuted, fontFamily:"IBM Plex Mono, monospace" }}>{new Date(h.date).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
                <button onClick={()=>remove(h.id)} style={{ background:"none", border:"none", color:T.textMuted, cursor:"pointer" }}><IX size={13}/></button>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
